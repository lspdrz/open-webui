name: Sync Upstream and Build

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip upstream merge & git tagging (build & push Docker image only)'
        type: boolean
        default: false
      tag:
        description: 'Specific tag to build (leave empty to auto-detect latest v* tag)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if tag has already been synced'
        type: boolean
        default: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add upstream remote and fetch tags safely
      run: |
        git remote add upstream https://github.com/open-webui/open-webui.git || git remote set-url upstream https://github.com/open-webui/open-webui.git
        # Fetch upstream tags into a dedicated ref namespace to prevent clobbering existing local/origin tags
        git fetch upstream '+refs/tags/*:refs/upstream-tags/*' --force

    - name: Find upstream tag and check for changes
      id: check_tag
      run: |
        INPUT_TAG="${{ github.event.inputs.tag }}"
        FORCE_BUILD="${{ github.event.inputs.force_build }}"
        SKIP_SYNC="${{ github.event.inputs.skip_sync }}"

        if [ -n "$INPUT_TAG" ]; then
          TARGET_TAG="$INPUT_TAG"
          echo "Using manually specified tag: $TARGET_TAG"
        else
          # Find latest upstream tag matching v* sorted by version
          TARGET_TAG=$(git for-each-ref --format='%(refname:strip=2)' 'refs/upstream-tags/v*' | grep -E '^v[0-9]+(\.[0-9]+)*' | sort -V | tail -n 1)
          # If no upstream tags found, fallback to local tags
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(git tag -l "v*" --sort=v:refname | tail -n 1)
          fi
          echo "Latest version tag found: $TARGET_TAG"
        fi

        if [ -z "$TARGET_TAG" ]; then
          echo "Error: No matching tag found."
          exit 1
        fi

        # Check if upstream tag commit is already an ancestor of HEAD (already merged into main)
        IS_ANCESTOR=false
        if git rev-parse --verify "refs/upstream-tags/$TARGET_TAG" >/dev/null 2>&1; then
          if git merge-base --is-ancestor "refs/upstream-tags/$TARGET_TAG" HEAD 2>/dev/null; then
            IS_ANCESTOR=true
          fi
        fi

        # Check if origin already has this tag
        ORIGIN_HAS_TAG=false
        if [ -n "$(git ls-remote --tags --refs origin "refs/tags/$TARGET_TAG")" ]; then
          ORIGIN_HAS_TAG=true
        fi

        echo "Target Tag: $TARGET_TAG"
        echo "Is upstream tag ancestor of HEAD: $IS_ANCESTOR"
        echo "Origin has tag: $ORIGIN_HAS_TAG"
        echo "Skip sync requested: $SKIP_SYNC"

        NEEDS_MERGE=false
        NEEDS_TAG=false
        NEEDS_BUILD=false

        if [ "$SKIP_SYNC" = "true" ]; then
          echo "Sync skipped by user. Proceeding directly to build."
          NEEDS_BUILD=true
        else
          if [ "$IS_ANCESTOR" = "false" ]; then
            NEEDS_MERGE=true
            NEEDS_TAG=true
            NEEDS_BUILD=true
          fi

          if [ "$ORIGIN_HAS_TAG" = "false" ]; then
            NEEDS_TAG=true
            NEEDS_BUILD=true
          fi

          if [ "$FORCE_BUILD" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEEDS_BUILD=true
          fi
        fi

        echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
        echo "version=${TARGET_TAG#v}" >> $GITHUB_OUTPUT
        echo "needs_merge=$NEEDS_MERGE" >> $GITHUB_OUTPUT
        echo "needs_tag=$NEEDS_TAG" >> $GITHUB_OUTPUT
        echo "needs_build=$NEEDS_BUILD" >> $GITHUB_OUTPUT

    - name: Merge upstream tag and update git tag
      if: steps.check_tag.outputs.needs_merge == 'true' || steps.check_tag.outputs.needs_tag == 'true'
      run: |
        TARGET_TAG="${{ steps.check_tag.outputs.target_tag }}"
        NEEDS_MERGE="${{ steps.check_tag.outputs.needs_merge }}"
        NEEDS_TAG="${{ steps.check_tag.outputs.needs_tag }}"

        git checkout main
        git pull origin main --no-edit

        if [ "$NEEDS_MERGE" = "true" ]; then
          echo "Merging upstream tag $TARGET_TAG into main..."
          git merge "refs/upstream-tags/$TARGET_TAG" -m "Merge tag '$TARGET_TAG' from upstream" --no-edit
          git push origin main
        fi

        if [ "$NEEDS_TAG" = "true" ]; then
          echo "Tagging HEAD as $TARGET_TAG..."
          git tag -a "$TARGET_TAG" -m "Release $TARGET_TAG with cognito patch" -f
          git push origin "refs/tags/$TARGET_TAG" --force
        fi

    - name: Set up Docker Buildx
      if: steps.check_tag.outputs.needs_build == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: steps.check_tag.outputs.needs_build == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      if: steps.check_tag.outputs.needs_build == 'true'
      run: |
        TARGET_TAG="${{ steps.check_tag.outputs.target_tag }}"
        VERSION="${{ steps.check_tag.outputs.version }}"
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        GIT_HASH=$(git rev-parse --short HEAD)

        IMAGE_TAG_V="ghcr.io/forpublicai/open-webui:$TARGET_TAG"
        IMAGE_TAG_NUM="ghcr.io/forpublicai/open-webui:$VERSION"
        IMAGE_TAG_COGNITO_V="ghcr.io/forpublicai/open-webui:cognito-patch-$TARGET_TAG"
        IMAGE_TAG_COGNITO_HASH="ghcr.io/forpublicai/open-webui:cognito-patch-$GIT_HASH-$TIMESTAMP"
        IMAGE_TAG_LATEST_COGNITO="ghcr.io/forpublicai/open-webui:latest-cognito-patch"
        IMAGE_TAG_LATEST="ghcr.io/forpublicai/open-webui:latest"

        docker build \
          --no-cache \
          --platform linux/amd64 \
          --build-arg USE_SLIM=true \
          -t "$IMAGE_TAG_V" \
          -t "$IMAGE_TAG_NUM" \
          -t "$IMAGE_TAG_COGNITO_V" \
          -t "$IMAGE_TAG_COGNITO_HASH" \
          -t "$IMAGE_TAG_LATEST_COGNITO" \
          -t "$IMAGE_TAG_LATEST" \
          .

        docker push "$IMAGE_TAG_V"
        docker push "$IMAGE_TAG_NUM"
        docker push "$IMAGE_TAG_COGNITO_V"
        docker push "$IMAGE_TAG_COGNITO_HASH"
        docker push "$IMAGE_TAG_LATEST_COGNITO"
        docker push "$IMAGE_TAG_LATEST"

        echo "Successfully built and pushed images for tag: $TARGET_TAG"